version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: auction_db
    environment:
      POSTGRES_USER: auction_user
      POSTGRES_PASSWORD: auction_password
      POSTGRES_DB: auction_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auction_network

  # Backend API Server
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: auction_backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://auction_user:auction_password@postgres:5432/auction_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: auction_user
      DB_PASSWORD: auction_password
      DB_NAME: auction_db
      JWT_SECRET: your_jwt_secret_key_min_32_characters_change_in_production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src
    networks:
      - auction_network

  # Frontend Application
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: auction_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: your_nextauth_secret_change_in_production
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./apps/frontend/src:/app/src
    networks:
      - auction_network

volumes:
  postgres_data:
    driver: local

networks:
  auction_network:
    driver: bridge
